name: release-docker

on:
  workflow_dispatch:
    inputs:
      version:
        description: "release version/tag"
        required: true

# Since SiYuan v3.8.7 the Dockerfile compiles onnxruntime from source (for OCR).
# Under QEMU emulation that takes 6+ hours for arm64, so each platform is built
# on its own native runner, then the two images are merged into one tag.

jobs:
  build:
    name: build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm # native arm64, free for public repos
    runs-on: ${{ matrix.runner }}
    # A cold build (onnxruntime compiled from scratch) takes roughly an hour;
    # with the registry cache warm it's a few minutes. Fail early if it hangs.
    timeout-minutes: 180

    permissions:
      contents: read

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v7
        with:
          path: siyuan-note

      - name: clone origin and apply patches
        run: |
          cd ${{ github.workspace }}/siyuan-note/

          git clone --branch ${{ github.event.inputs.version }} https://github.com/siyuan-note/siyuan.git
          cd siyuan

          git apply --3way ${{ github.workspace }}/siyuan-note/patches/siyuan.patch

          git status

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PWD }}

      - name: Build and push ${{ matrix.platform }} by digest
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan
        env:
          IMAGE: ${{ secrets.DOCKER_HUB_USER }}/siyuan
          CACHE: ${{ secrets.DOCKER_HUB_USER }}/siyuan:buildcache-${{ matrix.arch }}
        run: |
          # ONNX_BUILD_PARALLEL: runners have 4 vCPUs / 16 GB; upstream's default is 2.
          # Keep this value fixed, since changing it invalidates the cached onnxruntime layer.
          # The registry cache (mode=max) keeps the compiled onnxruntime between runs,
          # so it's only rebuilt when upstream changes the onnx version or base image.
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --build-arg ONNX_BUILD_PARALLEL=4 \
            --cache-from "type=registry,ref=$CACHE" \
            --cache-to "type=registry,ref=$CACHE,mode=max" \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file "$RUNNER_TEMP/metadata.json" \
            --progress plain \
            .

          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/metadata.json")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "No image digest in build metadata"; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish multi-arch tags
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PWD }}

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ secrets.DOCKER_HUB_USER }}/siyuan
          VERSION: ${{ github.event.inputs.version }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:latest" \
            -t "$IMAGE:$VERSION" \
            $(printf "$IMAGE@sha256:%s " *)

          docker buildx imagetools inspect "$IMAGE:$VERSION"
